<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff — ร้านตัดผม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section id="login-screen" class="login-wrap">
  <div class="login-card">
    <h1>The Gentleman&apos;s Chair</h1>
    <p class="sub">Staff Login</p>
    <label>Username</label>
    <input type="text" id="login-user" placeholder="username">
    <label>Password</label>
    <input type="password" id="login-pass" placeholder="password">
    <button class="btn block" onclick="login()">เข้าสู่ระบบ</button>
    <p class="hint">Admin เป็นผู้สร้างบัญชีให้ (ทดลองพิมพ์อะไรก็ได้)</p>
  </div>
</section>

<div id="app" style="display:none">
  <aside class="sidebar">
    <div class="brand">Staff Panel</div>
    <button class="nav-item active" data-view="dashboard">Dashboard</button>
    <button class="nav-item" data-view="myqueue">My Queue</button>
    <button class="nav-item" data-view="payment">Payment Verification</button>
    <button class="nav-item" data-view="chair">Chair Status</button>
    <button class="nav-item" data-view="history">History</button>
    <button class="nav-item" data-view="revenue">Revenue</button>
    <button class="nav-item logout" onclick="logout()">Logout</button>
  </aside>

  <main>
    <header class="topbar">
      <span id="staff-name-badge"></span>
      <span class="chip" id="chair-badge"></span>
    </header>

    <section class="view active" id="view-dashboard">
      <h2 class="section-title">Staff Dashboard</h2>
      <div class="stat-grid" id="dash-stats"></div>
      <h3 class="sub-title">ลูกค้าปัจจุบัน</h3>
      <div id="dash-current"></div>
    </section>

    <section class="view" id="view-myqueue">
      <h2 class="section-title">My Queue</h2>
      <p class="note">แสดงเฉพาะคิวของคุณ และคิว "ไม่ระบุช่าง" ที่ยังไม่มีใครรับ</p>
      <div id="myqueue-list"></div>
    </section>

    <section class="view" id="view-payment">
      <h2 class="section-title">Payment Verification</h2>
      <div class="filter-bar" id="pay-filters"></div>
      <div id="payment-list"></div>
    </section>

    <section class="view" id="view-chair">
      <h2 class="section-title">Chair Status</h2>
      <div id="chair-card"></div>
    </section>

    <section class="view" id="view-history">
      <h2 class="section-title">ประวัติของฉัน</h2>
      <div id="history-list"></div>
    </section>

    <section class="view" id="view-revenue">
      <h2 class="section-title">Revenue</h2>
      <div class="stat-grid" id="revenue-stats"></div>
    </section>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-content"></div>
</div>
<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
